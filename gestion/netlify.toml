# El estudio de folletos recorta fondos con IA en el navegador (onnxruntime necesita eval y wasm)
[[headers]]
  for = "/folleto/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://esm.sh; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' data: blob: https://ajxdzchffqaphkmetswx.supabase.co wss://ajxdzchffqaphkmetswx.supabase.co https://cdn.jsdelivr.net https://esm.sh https://staticimgly.com; worker-src 'self' blob: https://cdn.jsdelivr.net https://esm.sh; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

# App instalable: el service worker no debe quedarse en caché
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store"
