<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Huelsan · Facturación</title>
<link rel="icon" href="../favicon.svg">
<link rel="manifest" href="../manifest.webmanifest" crossorigin="use-credentials">
<script src="../adaptador.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#F3F2EF;--surface:#fff;--sunk:#E9E7E2;--line:#D9D6D0;--ink:#1B1D20;--muted:#5C6168;--accent:#8C6E44;--accent-ink:#fff;--soft:#EFE7DA;
  --ok:#067647;--okbg:#E3F3EA;--warn:#93370D;--warnbg:#FEF0C7;--bad:#B42318;--badbg:#FBE9E7}
@media (prefers-color-scheme:dark){:root{--bg:#121315;--surface:#1B1D20;--sunk:#25282C;--line:#33373C;--ink:#ECEBE8;--muted:#A2A6AC;--accent:#CDB084;--accent-ink:#1B1D20;--soft:#352D22;
  --ok:#6CC592;--okbg:#1D3427;--warn:#F5C26B;--warnbg:#3A2E14;--bad:#F2867A;--badbg:#3A201D}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:6}
header.top a{color:inherit}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;padding:10px 16px 0;max-width:1280px;margin:0 auto}
nav.tabs button{font:inherit;font-weight:600;font-size:14px;padding:8px 12px;border:1px solid transparent;border-bottom:0;border-radius:8px 8px 0 0;background:none;color:var(--muted);cursor:pointer}
nav.tabs button[aria-selected=true]{background:var(--surface);border-color:var(--line);color:var(--ink)}
main{max-width:1280px;margin:0 auto;padding:0 16px 60px}
.hoja{background:var(--surface);border:1px solid var(--line);border-radius:0 12px 12px 12px;padding:16px;display:grid;gap:16px}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:0}h3{font-size:14px;margin:0;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row.sp{justify-content:space-between}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:760px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}
label{display:grid;gap:3px;font-size:12.5px;font-weight:600;color:var(--muted);min-width:0;align-content:end}
.g2,.g3,.g4{align-items:end}.card{align-content:start}
label small{font-weight:400}
input,select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 9px;width:100%;min-width:0}
textarea{resize:vertical;min-height:64px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
input[readonly],textarea[readonly],select:disabled,input:disabled{background:var(--sunk);color:var(--muted)}
input.mal{border-color:var(--bad)}
.btn{font:inherit;font-weight:650;font-size:13.5px;padding:8px 13px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.peligro{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
.card{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px;background:var(--surface)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.kpi{background:var(--bg);border-radius:10px;padding:10px 12px}.kpi b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.kpi span{font-size:12.5px;color:var(--muted)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line);background:var(--bg);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr[data-abrir]{cursor:pointer}tbody tr[data-abrir]:hover{background:var(--bg)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.03em;padding:2px 7px;border-radius:5px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.warn{background:var(--warnbg);color:var(--warn)}.tag.bad{background:var(--badbg);color:var(--bad)}.tag.acc{background:var(--soft);color:var(--accent)}
.mat{font-family:ui-monospace,Menlo,monospace;font-weight:700;letter-spacing:.04em;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 5px;white-space:nowrap}
.lineas td{padding:4px}.lineas input,.lineas select,.lineas textarea{padding:6px 7px;font-size:13.5px}
.lineas textarea{min-height:34px}
.totales{display:grid;gap:4px;justify-self:end;min-width:280px;font-variant-numeric:tabular-nums}
.totales div{display:flex;justify-content:space-between;gap:20px}.totales .t{font-size:18px;font-weight:800;border-top:2px solid var(--ink);padding-top:6px;margin-top:4px}
.aviso{border-radius:10px;padding:10px 12px;font-size:13.5px;background:var(--warnbg);color:var(--warn)}
.aviso.bad{background:var(--badbg);color:var(--bad)}.aviso.ok{background:var(--okbg);color:var(--ok)}
.bar{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 0 2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;z-index:3}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:50;font-size:14px;max-width:calc(100% - 32px)}
dialog{border:0;border-radius:14px;padding:0;max-width:760px;width:calc(100% - 24px);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,11,12,.55)}
dialog form{padding:16px;display:grid;gap:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.seg label{display:flex;flex-direction:row;align-items:center;gap:6px;padding:7px 12px;cursor:pointer;font-size:13.5px;color:var(--ink)}
.seg input{width:auto;margin:0}.seg label:has(input:checked){background:var(--ink);color:var(--bg)}
.files{display:grid;gap:6px}.files div{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:13px;background:var(--bg);border-radius:8px;padding:6px 8px}
.hist{font-size:12.5px;color:var(--muted);display:grid;gap:2px}
.vacio{border:1px dashed var(--line);border-radius:10px;padding:24px;text-align:center;color:var(--muted)}
[hidden]{display:none!important}
</style></head><body>
<header class="top"><a href="../">← Volver a la app</a><b>HUELSAN · FACTURACIÓN</b><span class="muted" id="estado-con">Conectando…</span></header>
<nav class="tabs" role="tablist" aria-label="Secciones de facturación">
  <button role="tab" data-tab="facturas" aria-selected="true">Facturas</button>
  <button role="tab" data-tab="clientes" aria-selected="false">Clientes</button>
  <button role="tab" data-tab="gastos" aria-selected="false">Compras y gastos</button>
  <button role="tab" data-tab="matriculas" aria-selected="false">Por matrícula</button>
  <button role="tab" data-tab="resumen" aria-selected="false">IVA y libros</button>
  <button role="tab" data-tab="emisor" aria-selected="false">Datos fiscales</button>
</nav>
<main><div class="hoja" id="vista"><p class="muted">Cargando…</p></div></main>

<dialog id="dlg-cliente"><form method="dialog" id="f-cliente" autocomplete="off"></form></dialog>
<dialog id="dlg-gasto"><form method="dialog" id="f-gasto" autocomplete="off"></form></dialog>
<dialog id="dlg-cobro"><form method="dialog" id="f-cobro" autocomplete="off"></form></dialog>
<dialog id="dlg-confirm"><form method="dialog" id="f-confirm"></form></dialog>
<div id="toast" role="status" hidden></div>
<script src="facturacion.js"></script>
</body></html>
