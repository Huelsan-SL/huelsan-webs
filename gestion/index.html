<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}.hmenu{position:relative;margin-left:10px}.hmenu summary{list-style:none;color:var(--ink)}.hmenu summary::-webkit-details-marker{display:none}
.hmenu nav{position:absolute;right:0;top:calc(100% + 6px);z-index:50;min-width:250px;display:grid;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px}
.hmenu nav a,.hmenu nav button{display:block;text-align:left;padding:10px 12px;border-radius:6px;color:inherit;text-decoration:none;font:inherit;background:none;border:0;cursor:pointer}
.hmenu nav a:hover,.hmenu nav button:hover{background:var(--bg)}.hmenu nav [hidden]{display:none}
</style></head><body>
<title>Huelsan · Gestión</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="favicon.svg">
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
<meta name="theme-color" content="#1B1D20">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Huelsan">
<script src="adaptador.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: barra superior con pestañas; en Subastas, panel de filtros a la izquierda y listado de lotes a la derecha; ficha del lote en panel lateral. */
:root{
  --bg:#F0EFED; --surface:#FFFFFF; --sunk:#E6E4E0; --line:#D6D4CF;
  --ink:#1B1D20; --muted:#5E636A; --accent:#8C6E44; --accent-ink:#FFFFFF; --accent-soft:#EFE8DC;
  --hdr:#1B1D20; --hdr-ink:#F0EFED; --champ:#B8976A;
  --good:#2F7A4F; --good-soft:#E1F0E6; --warn:#A35F0B; --warn-soft:#F7EAD6; --bad:#B23A32; --bad-soft:#F6E0DE;
  --plate:#1F4AA8; --shadow:0 1px 2px rgba(20,25,28,.06),0 6px 20px rgba(20,25,28,.06);
  --f-brand:"Syncopate","Arial Black",sans-serif; --f-display:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif; --f-body:"Hanken Grotesk","Segoe UI",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141517; --surface:#1D1F22; --sunk:#26292D; --line:#363A3F;
  --ink:#ECEBE8; --muted:#A2A6AC; --accent:#CDB084; --accent-ink:#1B1D20; --accent-soft:#3A3226;
  --hdr:#0E0F11; --hdr-ink:#ECEBE8; --champ:#CDB084;
  --good:#6CC592; --good-soft:#1D3327; --warn:#E3A857; --warn-soft:#3A2C18; --bad:#EE8177; --bad-soft:#3D2220;
  --plate:#3F6FD6; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141517; --surface:#1D1F22; --sunk:#26292D; --line:#363A3F;
  --ink:#ECEBE8; --muted:#A2A6AC; --accent:#CDB084; --accent-ink:#1B1D20; --accent-soft:#3A3226;
  --hdr:#0E0F11; --hdr-ink:#ECEBE8; --champ:#CDB084;
  --good:#6CC592; --good-soft:#1D3327; --warn:#E3A857; --warn-soft:#3A2C18; --bad:#EE8177; --bad-soft:#3D2220;
  --plate:#3F6FD6; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tnum{font-variant-numeric:tabular-nums}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hdr);color:var(--hdr-ink)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;padding:12px 16px 0}
.brand{font:700 18px/1 var(--f-brand);letter-spacing:.14em;display:flex;align-items:center;gap:12px}
.brand .brand-txt{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.logo-sym{width:36px;height:auto;flex:none;color:currentColor;display:block}
.lgs{stroke:var(--champ)} .lgf{fill:var(--champ)}
.pubbrand{display:flex;align-items:center;gap:16px;margin-bottom:12px}
.pubbrand .logo-sym{width:64px}
.pubbrand b{display:block;font:700 22px/1 var(--f-brand);letter-spacing:.14em}
.pubbrand span{display:block;margin-top:8px;font:500 11px/1 var(--f-body);letter-spacing:.5em;text-transform:uppercase;color:var(--champ)}
.brand small{font:500 11px var(--f-body);letter-spacing:.42em;text-transform:uppercase;color:var(--champ)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;padding:0 12px;scrollbar-width:none}
nav.tabs button{background:none;border:0;color:inherit;opacity:.7;padding:12px 12px 11px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;font-weight:500}
nav.tabs button[aria-selected="true"]{opacity:1;border-color:var(--champ)}
nav.tabs .count{font-size:11px;opacity:.7;margin-left:4px}
.status{margin-left:auto;font-size:12px;opacity:.7}
main{padding-block:20px 48px;padding-inline:16px;max-width:1440px;margin:0 auto}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:6px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.ghost{background:none;border-color:transparent}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:26px;font-weight:700}
h2{font-size:18px;font-weight:650}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-family:var(--f-body);font-weight:600}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pagehead{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:end;justify-content:space-between;margin-bottom:16px}
.pagehead p{margin:4px 0 0;color:var(--muted);max-width:70ch}

/* import */
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:16px 18px;background:var(--surface);display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;margin-bottom:18px}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop strong{font-family:var(--f-display);font-size:15px}
.auctions{display:flex;flex-wrap:wrap;gap:8px}
.auc{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--surface);font-size:12.5px;cursor:pointer}
.auc[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.auc b{font-weight:600}
.auc{display:grid;gap:2px;text-align:left;max-width:340px}
.aucdesc{color:var(--ink);font-size:12.5px}
.aucmeta{color:var(--muted);font-size:11.5px}
.subbar{display:flex;flex-wrap:wrap;align-items:end;gap:10px 16px;margin-bottom:12px}
.subbar .seg button{padding:7px 12px;font-size:13px;color:var(--ink)}
.subbar .seg button[aria-pressed="true"]{color:var(--bg)}
.subsel{display:grid;gap:3px;font-size:12px;font-weight:600;color:var(--muted);flex:1 1 200px;max-width:380px;min-width:0}
.subsel select{width:100%;min-width:0}
.mode{justify-self:start;display:inline-block;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.mode.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.estprog{font-size:12.5px;color:var(--accent);font-weight:600}
.bcalink{font-size:12px;font-weight:600;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:var(--surface);white-space:nowrap}
.bcalink:hover{border-color:var(--accent)}
.lot:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.aucline{display:flex;flex-wrap:wrap;align-items:center;gap:3px 10px;font-size:12px;color:var(--muted);margin-top:4px}
.auc .aucfoot{display:flex;justify-content:flex-end;margin-top:4px}
.aucarch{border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:5px;padding:2px 8px;font-size:11.5px;font-weight:600;cursor:pointer}
.aucarch:hover{border-color:var(--bad);color:var(--bad)}
.aucarch[data-confirm="1"]{background:var(--bad);border-color:var(--bad);color:#fff}
/* recogida manual */
.rec{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px;display:grid;gap:10px}
.rec .rechead{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;justify-content:space-between}
.rec .recst{font-size:13px}
.rec .recst b{font-weight:600}
.rec .recst.ok b{color:var(--good)}
.rec .recst.warn b{color:var(--warn)}
.rec .recst.bad b{color:var(--bad)}
.rec .recst.run b{color:var(--accent)}
.rec .steps{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rec .btn[disabled]{opacity:.5;cursor:not-allowed}
.rec .recmsg{font-size:12.5px;color:var(--muted)}
.archlist{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.archlist .card{display:flex;gap:10px;align-items:center;padding:8px 12px;font-size:12.5px}
/* importación de fichas al stock */
.imp{display:grid;gap:12px}
.impitem{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px}
.impitem.off{opacity:.55}
.impitem .ih{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.impitem .ih label{display:flex;gap:8px;align-items:flex-start;cursor:pointer;min-width:0}
.impitem .ih input[type=checkbox]{margin-top:4px;accent-color:var(--accent)}
.impthumbs{display:flex;gap:4px;flex-wrap:wrap}
.impthumbs img{width:72px;height:48px;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
.prog{font-size:12.5px;color:var(--accent);font-weight:600}
/* gastos */
.gtab{width:100%;min-width:0;border-collapse:collapse;font-size:13px}
.gtab td,.gtab th{padding:6px 8px;border-bottom:1px solid var(--line);white-space:normal}
.gtab th{background:none;font-size:11px}
.gadd{display:grid;grid-template-columns:120px minmax(120px,1fr) minmax(120px,1.3fr) 100px auto;gap:6px;align-items:end}
@media (max-width:640px){.gadd{grid-template-columns:1fr 1fr}}
.gadd label{display:grid;gap:3px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
.gsum{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px}
.car{cursor:pointer;text-align:left}
.car:hover{border-color:var(--muted)}
.car .pubact{display:flex;gap:6px;flex-wrap:wrap}

/* layout subastas */
.split{display:grid;grid-template-columns:290px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:minmax(0,1fr)}}
aside.filters{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;position:sticky;top:120px;max-height:calc(100vh - 140px);overflow:auto}
@media (max-width:900px){aside.filters{position:static;max-height:none}aside.filters:not(.open) .fbody{display:none}}
.fhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fbody{display:grid;gap:14px;margin-top:12px}
.fgroup{display:grid;gap:6px}
.faplicar-pie{position:sticky;bottom:-14px;background:var(--surface);padding:10px 0 2px;margin-top:4px;border-top:1px solid var(--line)}
.fgroup>label,.fgroup>.lbl{font-size:12px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.fgroup .n{font-weight:400;font-size:11px;color:var(--muted)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:6px}
input[type=number],input[type=text],input[type=search],input[type=email],input[type=tel],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
textarea{resize:vertical;min-height:70px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chk{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:12px;cursor:pointer;user-select:none;background:var(--bg)}
.chk input{display:none}
.chk:has(input:checked){background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:inline-grid;grid-auto-flow:column;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--bg);padding:4px 9px;font-size:12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.toggle{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;cursor:pointer}
.toggle input{margin-top:3px;accent-color:var(--accent)}
.sep{height:1px;background:var(--line)}

/* listado */
.listbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:10px}
.listbar .sum{font-size:13px}
.listbar .sum b{font-family:var(--f-display);font-size:18px}
.lots{display:grid;gap:8px}
.lot{display:grid;grid-template-columns:112px minmax(0,1fr) auto;gap:6px 16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.lot:hover{border-color:var(--muted)}
.lot.off{opacity:.55}
.qk{display:flex;gap:6px;justify-content:flex-end}
.qbtn{font:inherit;font-size:12px;font-weight:600;padding:4px 9px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap}
.qbtn:hover{border-color:var(--accent);color:var(--accent)}
.qbtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.qbtn.x.on{background:var(--muted);border-color:var(--muted);color:var(--surface)}
@media (max-width:640px){.lot{grid-template-columns:minmax(0,1fr)}.lot .right{justify-items:start;text-align:left}}
.lot .t{font:650 15.5px/1.25 var(--f-display)}
.lot .d{font-size:12.5px;color:var(--muted)}
.specs{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;margin-top:4px}
.specs span b{font-weight:600}
.flags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:1px 7px;border-radius:4px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.good{background:var(--good-soft);color:var(--good)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.acc{background:var(--accent-soft);color:var(--accent)}
.right{display:grid;justify-items:end;gap:4px;text-align:right}
.price{font:700 17px var(--f-display)}
.plate{display:inline-flex;align-items:stretch;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden;font:500 13px/1 var(--f-mono);letter-spacing:.06em;background:#FFFFFF;color:#111;height:24px}
.plate i{font-style:normal;background:var(--plate);color:#fff;font:600 8px/1 var(--f-body);display:grid;place-items:end center;padding:0 3px 3px;width:14px}
.plate span{display:grid;place-items:center;padding:0 7px}
.state{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;padding:2px 7px;border-radius:4px;border:1px solid var(--line)}
.state.interesante{border-color:var(--accent);color:var(--accent)}
.state.pujar{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.state.descartado{color:var(--muted)}
.state.comprado,.state.stock{background:var(--good-soft);color:var(--good);border-color:transparent}
.state.vendido{background:var(--sunk);color:var(--muted)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:28px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:var(--f-display);font-size:16px;margin-bottom:4px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,14,16,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);z-index:41;overflow:auto;box-shadow:var(--shadow);padding:calc(env(safe-area-inset-top,0px) + 18px) 18px calc(env(safe-area-inset-bottom,0px) + 30px)}
.dhead{display:flex;gap:12px;justify-content:space-between;align-items:start;margin-bottom:14px}
.dsec{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;display:grid;gap:10px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px 14px}
.kv div{display:grid;gap:2px;min-width:0}
.kv dt{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 12px}
.form label{display:grid;gap:3px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
.form label.wide{grid-column:1/-1}
.tri{display:inline-grid;grid-auto-flow:column;border:1px solid var(--line);border-radius:6px;overflow:hidden;width:max-content}
.tri button{border:0;background:var(--bg);padding:5px 10px;font-size:12.5px;cursor:pointer;font-weight:500}
.tri button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.states{display:flex;flex-wrap:wrap;gap:6px}
.states button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:12.5px;font-weight:500}
.states button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links a{font-size:12.5px;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:4px 9px;background:var(--surface)}
.equip{font-size:12.5px;color:var(--muted)}
.photos{display:flex;flex-wrap:wrap;gap:6px}
.photos img{width:96px;height:72px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:60;font-size:13px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

/* demandas */
.grid2{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.dem{display:grid;gap:6px}
.dem+.dem{margin-top:10px}
.matches{display:flex;flex-wrap:wrap;gap:6px}
.match{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:var(--bg);cursor:pointer}
.match:hover{border-color:var(--accent)}

/* tabla histórico */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--sunk)}
td.num,th.num{text-align:right}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--sunk)}

/* vista cliente */
.pub{--pub-bg:var(--surface)}
.pubhero{background:var(--hdr);color:var(--hdr-ink);border-radius:12px;padding:28px 24px;display:grid;gap:6px;margin-bottom:18px}
.pubhero h1{font-family:var(--f-brand);font-size:clamp(20px,3.2vw,30px);letter-spacing:.04em;line-height:1.25}
.pubhero p{margin:0;opacity:.75;max-width:60ch}
.pubfilters{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:16px}

<script>
const BLOB=window.HUELSAN_BLOB||"/_blob/";
"use strict";
/* ---------- utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur=n=>n==null||n===""||isNaN(n)?"—":new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n);
const num=n=>n==null||n===""||isNaN(n)?"—":new Intl.NumberFormat("es-ES").format(n);
const fdate=iso=>{if(!iso)return"—";const d=new Date(iso);return d.toLocaleDateString("es-ES",{day:"2-digit",month:"2-digit",year:"numeric"})};
const fdt=iso=>{if(!iso)return"—";const d=new Date(iso);return d.toLocaleDateString("es-ES",{day:"2-digit",month:"short"})+" "+d.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"})};
const toNum=v=>{if(v==null||v==="")return null;if(typeof v==="number")return v;const s=String(v).trim().replace(/\s/g,"");if(!s)return null;const n=Number(s.replace(/\./g,"").replace(",","."));return isNaN(n)?null:n};
const toDec=v=>{if(v==null||v==="")return null;if(typeof v==="number")return v;const n=Number(String(v).trim().replace(",","."));return isNaN(n)?null:n};
let toastT;function toast(m){let t=$("#toast");if(!t){t=document.createElement("div");t.id="toast";t.className="toast";t.setAttribute("role","status");document.body.appendChild(t)}t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3200)}

const TIPOS=["Utilitario","Compacto","Berlina","Familiar","Monovolumen","SUV","4x4","Deportivo","Descapotable","Furgoneta","Comercial"];
/* Furgonetas (furgón y combi) por modelo; chasis cabina y pick-ups siguen como Comercial */
const VAN_RE=/^(?:\S+\s+)?(berlingo|partner|rifter|kangoo|express|caddy|combo|dobl[oó]|fiorino|citan|townstar|transit|tourneo|jumpy|jumper|expert|boxer|scudo|ducato|proace|vito|sprinter|trafic|master|vivaro|movano|transporter|crafter|spacetourer|traveller|daily|nv200|primastar|talento|deliver|dokker|nemo|bipper|qubo|inca|zafira life|e-?nv200|e-?berlingo|e-?partner|e-?expert|e-?jumpy|e-?transit)\b/i;
const esFurgoneta=x=>{const m=String(x.modelo||"").trim();return VAN_RE.test(m)&&!/grand c4|\bc4\b|chasis|cami[oó]n/i.test(m+" "+(x.carroceria||""))};
const COMBUS=["Diésel","Gasolina","Híbrido","Híbrido enchufable","Eléctrico","GLP/GNC"];
const PROCED=["Concesionario","Flota","Renting","Particular","Rent a car","Otro"];
const ESTADOS=[["nuevo","Sin revisar"],["interesante","Interesante"],["pujar","Pujar"],["descartado","Descartado"],["comprado","Comprado"],["stock","En stock"],["vendido","Vendido"]];
const ESTADO_LBL=Object.fromEntries(ESTADOS);

/* ---------- normalización de datos BCA ---------- */
function normFuel(s){s=String(s||"").toLowerCase();
  if(/phev|enchuf|plug/.test(s))return"Híbrido enchufable";
  if(/el[eé]ctr|bev|\bev\b/.test(s))return"Eléctrico";
  if(/hev|h[ií]brid|mhev|mild/.test(s))return"Híbrido";
  if(/glp|gnc|lpg|cng|gas natural/.test(s))return"GLP/GNC";
  if(/diesel|di[eé]sel|gasoil/.test(s))return"Diésel";
  if(/gasol|petrol|benz/.test(s))return"Gasolina";return s?s[0].toUpperCase()+s.slice(1):null}
const MODEL_TIPO=[
  [/scenic|sc[eé]nic|picasso|touran|zafira|c-?max|s-?max|galaxy|sharan|alhambra|espace|grand|verso|5008|rifter|berlingo|caddy|kangoo|combo|partner/,"Monovolumen"],
  [/fiesta|ibiza|polo|corsa|clio|\b208\b|\b207\b|\b206\b|c3\b|yaris|i10|i20|picanto|rio\b|sandero|micra|up\b|aygo|twingo|panda|500\b|swift|mii|citigo|fabia|mazda2|\bka\b/,"Utilitario"],
  [/golf|le[oó]n|astra|focus|m[eé]gane|megane|c4\b|\b308\b|auris|corolla|civic|i30|ceed|octavia|a3\b|serie 1|clase a|mazda3|scala|tipo\b|arona/,"Compacto"],
  [/laguna|c5\b|passat|insignia|mondeo|\b508\b|\b407\b|a4\b|a6\b|serie 3|serie 5|clase c|clase e|superb|avensis|talisman|arteon/,"Berlina"],
  [/4x4|4motion|quattro|xdrive|4wd|awd|allgrip|4matic|all ?wheel/,"4x4"]];
function guessTipo(carroceria,modelo,derivado){
  if(esFurgoneta({modelo,carroceria}))return"Furgoneta";
  const m=(String(modelo)+" "+String(derivado)).toLowerCase(); const c=String(carroceria||"").toLowerCase();
  if(/4x4|4motion|quattro|xdrive|4wd|awd|allgrip|4matic/.test(m))return"4x4";
  if(/todoterreno|suv|crossover/.test(c))return"SUV";
  if(/familiar|break|estate|touring|sw\b|variant|avant/.test(c+" "+m))return"Familiar";
  if(/cabrio|descapot|roadster/.test(c+" "+m))return"Descapotable";
  if(/coup[eé]|deportiv/.test(c))return"Deportivo";
  if(/furg|comercial|van\b/.test(c))return"Comercial";
  if(/monovol/.test(c))return"Monovolumen";
  for(const [re,t] of MODEL_TIPO.slice(0,4)) if(re.test(m))return t;
  if(/turismo/.test(c))return"Monovolumen";
  return c?"Berlina":null}
function parseDMY(s,fallbackYear){ if(s==null||s==="")return null;
  if(typeof s==="number"){const d=XLSX.SSF.parse_date_code(s);return d?new Date(d.y,d.m-1,d.d,d.H||0,d.M||0).toISOString():null}
  if(s instanceof Date)return s.toISOString();
  const m=String(s).trim().match(/^(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?(?:\s+(\d{1,2}):(\d{2}))?/);
  if(!m)return null; let y=m[3]?+m[3]:fallbackYear; if(y<100)y+=2000;
  return new Date(y,+m[2]-1,+m[1],m[4]?+m[4]:0,m[5]?+m[5]:0).toISOString()}

function parseBCA(rows,fileName){
  const clean=v=>v==null?null:(typeof v==="string"?v.trim()||null:v);
  const hi=rows.findIndex(r=>r&&r.some(c=>clean(c)==="Matrícula"));
  if(hi<0)throw new Error("No encuentro la fila de cabecera con «Matrícula». ¿Es un listado de lotes de BCA?");
  const hdr=rows[hi].map(c=>clean(c));
  const meta={};
  for(let i=0;i<hi;i++){const r=rows[i]||[];for(let j=0;j<r.length;j++){const k=clean(r[j]);if(!k)continue;
    let v=null;for(let x=j+1;x<r.length;x++){if(clean(r[x])!=null){v=clean(r[x]);break}}
    if(/nombre de subasta/i.test(k))meta.nombre=v; else if(/^canal/i.test(k))meta.canal=v;
    else if(/fecha inicio/i.test(k))meta.inicioRaw=v; else if(/fecha finaliz/i.test(k))meta.finRaw=v;}}
  const fm=String(fileName||"").match(/(20\d{2})(\d{2})(\d{2})/); const yr=fm?+fm[1]:new Date().getFullYear();
  const subasta={portal:"BCA",nombre:meta.nombre||fileName,canal:meta.canal||null,inicio:parseDMY(meta.inicioRaw,yr),fin:parseDMY(meta.finRaw,yr),archivo:fileName||null};
  subasta.id=("bca-"+(subasta.nombre||"x")+"-"+(subasta.fin||"").slice(0,10)).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,120);
  const col=name=>hdr.findIndex(h=>h&&h.toLowerCase()===name.toLowerCase());
  const g=(r,name)=>{const i=col(name);return i<0?null:clean(r[i])};
  const lots=[];
  for(let i=hi+1;i<rows.length;i++){const r=rows[i];if(!r)continue;
    const mat=g(r,"Matrícula"),marca=g(r,"Marca");if(!mat&&!marca)continue;
    const link=g(r,"Ver vínculo del lote")||""; const idm=String(link).match(/id=(\d+)/);
    const id="bca-"+(idm?idm[1]:String(mat||i).replace(/\s/g,""));
    const fm2=parseDMY(g(r,"Fecha Matriculación"));
    const dc=String(g(r,"Clasificación de daños")||"").match(/(\d)/);
    const iva=String(g(r,"Tipo de IVA")||"");
    const fuelRaw=g(r,"Combustible");
    lots.push({id,fuente:"BCA",subastaId:subasta.id,subasta:{nombre:subasta.nombre,canal:subasta.canal,inicio:subasta.inicio,fin:subasta.fin},
      lote:g(r,"Nº Lote"),matricula:mat?String(mat).replace(/\s+/g,"").toUpperCase():null,
      marca,modelo:g(r,"Modelo"),derivado:g(r,"Derivado"),acabado:g(r,"Nivel de acabado"),
      motor:toDec(g(r,"Motor")),cv:toNum(g(r,"CV")),km:toNum(g(r,"Kilometraje")),
      fechaMatric:fm2,anio:fm2?new Date(fm2).getFullYear():null,
      carroceria:g(r,"Carrocería"),tipo:guessTipo(g(r,"Carrocería"),g(r,"Modelo"),g(r,"Derivado")),
      combustible:normFuel(fuelRaw),combustibleOrig:fuelRaw,color:g(r,"Color"),
      danosAccidente:g(r,"Daños por accidente"),danos:g(r,"Daños"),danosClasif:dc?+dc[1]:null,
      precioSalida:toNum(g(r,"Precio de salida")),precioCompraYa:toNum(g(r,"Precio compre ahora")),
      precioGuia:toNum(g(r,"Precio guía")),pvp:toNum(g(r,"Precio de venta al público")),
      uso:g(r,"Uso"),equipamiento:[g(r,"Equipamiento"),g(r,"Equipo 2")].filter(Boolean).join(", ")||null,
      procedencia:g(r,"Procedencia"),notasVendedor:g(r,"Notas"),
      iva:/rebu/i.test(iva)?"REBU":(/general|deducible|21/i.test(iva)?"General":null),
      url:link?(/^https?:/.test(link)?link:"https://"+link):null});
  }
  return {subasta,lots};
}

/* ---------- estado ---------- */
const S={limit:60,thumbs:new Map(),thumbReq:new Set(),tab:"subastas",lots:new Map(),subastas:new Map(),demandas:new Map(),db:null,assets:null,dbReady:false,open:null,
  aucSel:null,filtersOpen:false,pub:{tipo:"",precioMax:"",anioMin:""},
  f:{q:"",anioMin:"",anioMax:"",precioMin:"",precioMax:"",kmMax:"",duenosMax:"",libro:"any",sinAverias:false,sinAccidentes:false,sinManip:false,
     margenMin:"",margenMax:"",margenPctMin:"",bajoPujaMax:false,mecMax:"",comb:[],cvMin:"",cvMax:"",motorMin:"",motorMax:"",tipos:[],plazasMin:"",ubic:"",iva:"any",proced:[],sinImportados:false,
     danosMax:"",estados:["nuevo","interesante","pujar"],incluirDesconocidos:true,modo:"todas",subUbic:"",zonas:[]}};
try{const saved=JSON.parse(localStorage.getItem("huelsan-f")||"null");if(saved)Object.assign(S.f,saved)}catch(e){}
const saveF=()=>{try{localStorage.setItem("huelsan-f",JSON.stringify(S.f))}catch(e){}};
/* Filtros: los cambios van a un borrador (S.fd) y solo se aplican con «Aplicar filtros» (arriba y abajo del panel) o Intro en el buscador */
const draftF=()=>S.fd||(S.fd=JSON.parse(JSON.stringify(S.f)));
const fPend=()=>!!S.fd&&JSON.stringify(S.fd)!==JSON.stringify(S.f);
function aplicarYa(){S.f=JSON.parse(JSON.stringify(draftF()));saveF();S.limit=60;render()}

const now=()=>Date.now();
/* Una subasta archivada a mano cuenta como cerrada: sus lotes pasan al Histórico aunque no haya llegado la fecha */
const subArch=id=>!!(id&&S.subastas.get(id)?.archivada);
const isPast=l=>subArch(l.subastaId)||!!(l.subasta&&l.subasta.fin&&new Date(l.subasta.fin).getTime()<now());
const isOwned=l=>["comprado","stock","vendido"].includes(l.estado);
const kmYear=l=>{if(!l.km||!l.fechaMatric)return null;const y=(now()-new Date(l.fechaMatric).getTime())/31557600000;return y>0.3?Math.round(l.km/y):null};
function kmSuspect(l){ if(l.manipKm===true)return"sí"; if(l.manipKm===false)return"no";
  const ky=kmYear(l),age=l.anio?new Date().getFullYear()-l.anio:null; if(ky!=null&&age>=4&&ky<5000)return"revisar"; return null}
const refPrice=l=>l.precioSalida??(l.numPujas>0?l.siguientePuja:null)??l.precioReserva??l.precioCompraYa??l.precioGuia??null;
const priceLbl=l=>l.precioSalida!=null?"Precio salida":(l.numPujas>0&&l.siguientePuja!=null?`Puja mín. · ${l.numPujas} puja${l.numPujas>1?"s":""}`:(l.precioReserva!=null?"Reserva BCA":(l.precioCompraYa!=null?"Compre ahora":(l.precioGuia!=null?"Precio guía":(l.sobreCerrado?"Oferta en sobre":"Sin precio")))));
const subOnline=s=>!!s&&(s.online??/online|multicentro|internet/i.test(s.ubicacion||""));
const lotOnline=l=>l.online??subOnline(l.subasta);
const zonaOf=l=>l.ubicacion||null;
const cierreOf=l=>l.cierreLote||l.subasta?.fin||null;
/* ---------- Tasas de compra de BCA España (subastas nacionales, cliente nacional) ----------
   Fuente: bca.com › Pagos y Tasas, tarifas en vigor desde el 21/03/2023. Importes sin IVA.
   El precio del coche va sin IVA; la comisión y los honorarios de gestión llevan IVA (21 %). La tasa de tráfico (DGT) no lleva IVA según BCA. */
const BCA_TASAS={
  tramos:[[250,96],[500,127],[750,170],[1000,186],[1250,202],[1500,223],[1750,242],[2000,263],[2500,279],[3000,296],[3500,317],[4000,320],[4500,323],[5000,327],[5500,330],[6000,333],[6500,336],[7000,340],[7500,343],[8000,346],[8500,349],[9000,353],[9500,356],[10000,359],[10500,362],[11000,366],[11500,369],[12000,372],[13000,375],[14000,378],[15000,382],[16000,385]],
  pctDesde16000:0.024, electrico:450, honorarios:69.77, transferencia:55.70, iva:0.21, conIva:true};
function comisionBCA(p,l){if(l&&l.combustible==="Eléctrico")return BCA_TASAS.electrico;if(p>=16000)return Math.round(p*BCA_TASAS.pctDesde16000*100)/100;for(const[h,c]of BCA_TASAS.tramos)if(p<h)return c;return BCA_TASAS.tramos.at(-1)[1]}
function tasasBCA(p,l){if(p==null)return null;const c=comisionBCA(p,l),h=BCA_TASAS.honorarios,t=BCA_TASAS.transferencia,iva=BCA_TASAS.conIva?Math.round((c+h)*BCA_TASAS.iva*100)/100:0;return{comision:c,honorarios:h,transferencia:t,iva,total:Math.round((c+h+t+iva)*100)/100}}
/* ---------- Venta estimada según estado ----------
   El precio de mercado de Claude es para un coche en buen estado. Se descuenta un coste orientativo de puesta a punto
   según la clasificación de daños BCA (1 mejor … 5 peor) y el grado mecánico (A mejor … E peor): el mayor entre un fijo y un % del precio. */
const DED_DANOS={1:[0,0],2:[150,.01],3:[500,.03],4:[1200,.06],5:[2500,.12]};
const DED_MEC={A:[0,0],B:[200,.01],C:[600,.04],D:[1500,.10],E:[3000,.20]};
const red50=x=>Math.round(x/50)*50;
function dedEstado(l){if(!(l.mercado>0))return null;const d=DED_DANOS[l.danosClasif],m=DED_MEC[gradoMec(l)];
  const dd=d?red50(Math.max(d[0],d[1]*l.mercado)):0,dm=m?red50(Math.max(m[0],m[1]*l.mercado)):0;return{danos:dd,mec:dm,total:dd+dm}}
const ventaEst=l=>l.mercado>0?Math.max(0,l.mercado-dedEstado(l).total):null;
/* Transporte hasta nuestras instalaciones según dónde está el coche (importe sin IVA; se suma el 21 %) */
const TRANSPORTES=[{re:/alicante/i,ruta:"Alicante → Murcia",base:83},{re:/sevilla|carmona/i,ruta:"Sevilla → Huelva",base:123}];
function transporte(l){const txt=[l.ubicacion,l.ubicacionVehiculo].filter(Boolean).join(" ");const t=TRANSPORTES.find(x=>x.re.test(txt));
  if(!t)return null;const iva=Math.round(t.base*BCA_TASAS.iva*100)/100;return{ruta:t.ruta,base:t.base,iva,total:Math.round((t.base+iva)*100)/100}}
const transporteTotal=l=>transporte(l)?.total||0;
/* Coste de compra = precio de referencia + tasas BCA + transporte */
const costeCompra=l=>{const r=refPrice(l);if(r==null)return null;return r+tasasBCA(r,l).total+transporteTotal(l)};
const margen=l=>{const v=ventaEst(l),c=costeCompra(l);return v!=null&&c!=null?Math.round(v-c):null};
/* Margen entre el precio de subasta (salida; si no hay, puja mínima o reserva BCA) y el precio de venta estimado */
const margenSal=l=>margen(l);
const margenSalPct=l=>{const m=margen(l),c=costeCompra(l);return m!=null&&c>0?m/c*100:null};
/* Puja máxima sugerida: la puja (múltiplo de 50 €) con la que puja + tasas BCA no pasa del 70 % de la venta estimada según estado */
const PUJA_MAX_PCT=0.70;
function pujaMaxEst(l){const v=ventaEst(l);if(!(v>0))return null;const tope=v*PUJA_MAX_PCT;
  let lo=0,hi=Math.floor(tope/50);while(lo<hi){const mid=Math.ceil((lo+hi)/2);if(mid*50+tasasBCA(mid*50,l).total+transporteTotal(l)<=tope)lo=mid;else hi=mid-1}
  return lo>0?lo*50:null}
const okAnio=a=>a!=null&&+a>=1950&&+a<=new Date().getFullYear()+1?+a:null;
const okKm=k=>k!=null&&+k>=0?+k:null;
/* Grado mecánico BCA: A (mejor) a E; "z" = sin calificar */
const gradoMec=l=>{const g=String(l.gradoMecanico||"").trim().toUpperCase();return/^[A-E]$/.test(g)?g:null};
// «Audi Audi Q2…»: si la versión de BCA ya empieza por la marca, no se repite
const titleOf=l=>{const m=l.marca||"",d=l.derivado||l.modelo||"";return m&&d.toLowerCase().startsWith(m.toLowerCase()+" ")?d:[m,d].filter(Boolean).join(" ")};
/* Gastos desglosados por coche */
const GASTO_CATS=["Transporte y portes","Limpieza y estética","Mecánica y mantenimiento","Chapa y pintura","Neumáticos","ITV","Gestoría, transferencia e impuestos","Seguro","Comisiones de compra","Publicidad y venta","Garantía","Otros"];
const gastosDe=l=>{const d=Array.isArray(l.gastosDetalle)?l.gastosDetalle:[];if(!d.length&&+l.gastos>0)return[{id:"ant",fecha:null,categoria:"Otros",concepto:"Gastos anotados antes del desglose",importe:+l.gastos}];return d};
const gastosTotal=l=>gastosDe(l).reduce((s,g)=>s+(+g.importe||0),0);
const gastosPorCat=l=>{const o={};for(const g of gastosDe(l))o[g.categoria||"Otros"]=(o[g.categoria||"Otros"]||0)+(+g.importe||0);return o};
const costeTotal=l=>(l.precioCompra||0)+gastosTotal(l);
const publicPrice=l=>l.precioVenta??null;

/* ---------- filtros ---------- */
function passes(l,f){
  const U=f.incluirDesconocidos;
  const rng=(v,min,max)=>{if(v==null)return U||(min===""&&max==="");if(min!==""&&v<+min)return false;if(max!==""&&v>+max)return false;return true};
  if(f.q){const q=f.q.toLowerCase();if(![l.marca,l.modelo,l.derivado,l.matricula,l.color].join(" ").toLowerCase().includes(q))return false}
  if(!rng(l.anio,f.anioMin,f.anioMax))return false;
  if(!rng(refPrice(l),f.precioMin??"",f.precioMax))return false;
  if(!rng(l.km,"",f.kmMax))return false;
  if(!rng(l.duenos,"",f.duenosMax))return false;
  if(f.libro!=="any"){if(l.libro==null){if(!U)return false}else if(l.libro!==(f.libro==="si"))return false}
  if(f.sinAverias&&l.averias===true)return false; if(f.sinAverias&&!U&&l.averias==null)return false;
  if(f.sinAccidentes&&l.accidentes===true)return false; if(f.sinAccidentes&&!U&&l.accidentes==null)return false;
  if(f.sinManip){const k=kmSuspect(l);if(k==="sí"||k==="revisar")return false;if(!U&&k==null)return false}
  {const mn=f.margenMin??"",mx=f.margenMax??"",pc=f.margenPctMin??"";if(mn!==""||mx!==""||pc!==""){const m=margenSal(l),mp=margenSalPct(l);
    if(m==null){if(!U)return false}else{if(mn!==""&&m<+mn)return false;if(mx!==""&&m>+mx)return false;if(pc!==""&&(mp==null||mp<+pc))return false}}}
  if(f.bajoPujaMax){const pm=pujaMaxEst(l),r=refPrice(l);if(pm==null||r==null){if(!U)return false}else if(r>pm)return false}
  if(f.comb.length&&!f.comb.includes(l.combustible))return false;
  if(!rng(l.cv,f.cvMin,f.cvMax))return false;
  if(!rng(l.motor,f.motorMin,f.motorMax))return false;
  if(f.tipos.length&&!(l.tipo&&f.tipos.includes(l.tipo)))return false;
  if(f.plazasMin!==""){if(l.plazas==null){if(!U)return false}else if(l.plazas<+f.plazasMin)return false}
  if((f.zonas||[]).length&&!f.zonas.includes(zonaOf(l)))return false;
  if(f.iva!=="any"){if(!l.iva){if(!U)return false}else if(l.iva!==f.iva)return false}
  if(f.proced.length&&!(l.procedencia&&f.proced.includes(l.procedencia)))return false;
  if(f.sinImportados){if(l.importado===true)return false;if(!U&&l.importado==null)return false}
  if(f.mecMax){const g=gradoMec(l);if(g==null){if(f.mecMax!=="D")return false}else if(g>f.mecMax)return false}
  if(f.danosMax!==""){if(l.danosClasif==null){}else if(l.danosClasif>+f.danosMax)return false}
  return true}

/* ---------- cruce clientes ↔ coches ---------- */
function matchDemand(d,l){
  if(d.estado==="cerrada")return false;
  if(l.estado==="descartado"||l.estado==="vendido")return false;
  if(isPast(l)&&!isOwned(l))return false;
  if(d.tipos&&d.tipos.length&&!(l.tipo&&d.tipos.includes(l.tipo)))return false;
  if(d.combustibles&&d.combustibles.length&&!(l.combustible&&d.combustibles.includes(l.combustible)))return false;
  if(d.anioMin&&l.anio&&l.anio<+d.anioMin)return false;
  if(d.kmMax&&l.km&&l.km>+d.kmMax)return false;
  if(d.plazasMin&&l.plazas&&l.plazas<+d.plazasMin)return false;
  const p=isOwned(l)?l.precioVenta:(l.mercado??refPrice(l));
  if(d.presupuestoMax&&p&&p>+d.presupuestoMax*1.05)return false;
  if(d.marca&&!String(l.marca||"").toLowerCase().includes(String(d.marca).toLowerCase()))return false;
  return true}
const demandsFor=l=>[...S.demandas.values()].filter(d=>matchDemand(d,l));
const carsFor=d=>[...S.lots.values()].filter(l=>matchDemand(d,l));

function plate(m){if(!m)return"";const s=String(m).replace(/^(\d{4})([A-Z]{3})$/,"$1 $2");return`<span class="plate" aria-label="Matrícula ${esc(m)}"><i>E</i><span>${esc(s)}</span></span>`}
function flagsOf(l){const t=[];
  if(l.libro===true)t.push(`<span class="tag good">Libro mant.</span>`);else if(l.libro===false)t.push(`<span class="tag warn">Sin libro</span>`);

  if(l.averias===true)t.push(`<span class="tag bad">Avería grave</span>`);

  if(window.cambiosWeb&&window.cambiosWeb(l).length)t.push(`<span class="tag warn">Cambios sin publicar</span>`);

function describeSubasta(s,ls){
  const n=String(s.nombre||"").toLowerCase()+" "+String(s.tipo||"").toLowerCase();const p=[];
  if(/top quality|young|seminuev/.test(n))p.push("Seminuevos: pocos años y pocos km");
  if(/renting|ayvens|alphabet|leasing|flota/.test(n))p.push("Coches de renting y flotas de empresa");
  if(/miniprecio|alta rentabilidad/.test(n))p.push("Coches económicos, muchos con bastantes km");
  if(/martillo/.test(n))p.push("Se adjudican al mejor postor");
  if(/marketprice|market price/.test(n))p.push("Valorados con el precio de mercado de BCA");
  if(/dañad|averi|mecánic|chapa/.test(n))p.push("Coches con daños o averías");
  if(/desguace/.test(n))p.push("Para desguace o piezas");
  if(/industrial|furgon|lcv|comercial/.test(n))p.push("Furgonetas y vehículos industriales");
  if(/el[eé]ctric|bev/.test(n))p.push("Eléctricos");
  if(ls&&ls.length){const com=ls.filter(l=>l.tipo==="Comercial").length;if(com/ls.length>0.4&&!p.some(x=>/Furgonetas/.test(x)))p.push("Mayoría furgonetas");
    const anios=ls.map(l=>l.anio).filter(Boolean).sort((a,b)=>a-b);if(anios.length)p.push("Años "+anios[0]+"–"+anios[anios.length-1])}
  if(!p.length||p.length===1&&/^Años/.test(p[0]))p.unshift("Usados variados: concesionario, flotas y particulares");
  return p.join(" · ")}
function thumbHtml(l){

/* Miniaturas: se borran de la base de datos 12 h después del cierre de la subasta (quedan los enlaces a las fotos de BCA).
   Los coches comprados o publicados en la web conservan su miniatura copiándola en el propio lote. */
const MINI_TTL=12*3600*1000;
async function limpiarMiniaturas(){return; /* desde el 28/10 se conserva la miniatura de cada coche */
  if(!S.db||!S.dbReady||S.limpiando)return; S.limpiando=true;
  try{
    const packs=new Map();
    for(const l of S.lots.values()){if(!l.miniPack)continue;
      const fin=cierreOf(l)||l.subasta?.fin;const t=fin?new Date(fin).getTime():NaN;
      const p=packs.get(l.miniPack)||{max:0,dudoso:false,lotes:[]};
      if(isNaN(t))p.dudoso=true;else p.max=Math.max(p.max,t);p.lotes.push(l.id);packs.set(l.miniPack,p)}
    let borradas=0;
    for(const[pack,p]of packs){
      if(p.dudoso||now()<p.max+MINI_TTL)continue;
      const guardar=p.lotes.map(id=>S.lots.get(id)).filter(l=>l&&(isOwned(l)||l.publico)&&!l.miniatura);
      if(guardar.length){let img={};try{const sn=await S.db.doc("miniaturas/"+pack).get();img=sn.exists?(sn.data().img||{}):{}}catch(e){continue}
        for(const l of guardar){if(img[l.id]){try{await S.db.doc("lotes/"+l.id).update({miniatura:img[l.id]})}catch(e){}}}}
      try{await S.db.doc("miniaturas/"+pack).delete()}catch(e){continue}
      for(const id of p.lotes){S.thumbs.delete(id);try{await S.db.doc("lotes/"+id).update({miniPack:null})}catch(e){}}
      borradas++}
    if(borradas)render();
  }catch(e){console.error(e)} finally{S.limpiando=false}}
function hydrateThumbs(){ if(!S.db)return;
  document.querySelectorAll("img[data-thumb]:not([src])").forEach(img=>{const id=img.dataset.thumb;
    if(S.thumbs.has(id)){if(S.thumbs.get(id))img.src=S.thumbs.get(id);return}
    if(S.thumbReq.has(id))return; S.thumbReq.add(id);
    const l=S.lots.get(id);const pack=l&&l.miniPack;if(!pack){S.thumbs.set(id,"");return}
    if(S.thumbReq.has(pack))return; S.thumbReq.add(pack);
    S.db.doc("miniaturas/"+pack).get().then(sn=>{const m=sn.exists?(sn.data().img||{}):{};
      for(const[k,v]of Object.entries(m))S.thumbs.set(k,v);
      document.querySelectorAll("img[data-thumb]:not([src])").forEach(x=>{const d=S.thumbs.get(x.dataset.thumb);if(d)x.src=d})}).catch(()=>S.thumbReq.delete(pack))})}

function recErr(e,host){const c=e&&e.code;

  if(c==="no_ext")return"Para lanzar recogidas desde la web instala en este ordenador la extensión «Huelsan · Recogida BCA» (Chrome o Edge) y entra en ella con tu usuario.";
  if(c==="ext")return e.message||"La extensión no ha podido lanzar la recogida.";
  return({not_granted:"La app no tiene permiso para usar conectores. Revísalo en el menú Permisos del artifact.",capability_disabled:"Los conectores no están disponibles en esta vista.",server_not_connected:"El conector «Claude Code Remote» no está disponible para tu cuenta.",needs_reauth:"Vuelve a conectar «Claude Code Remote» en Ajustes → Conectores.",not_in_manifest:"No se ha dado permiso para esta acción. Puedes activarlo en el menú Permisos del artifact.",approval_required:"Hace falta tu aprobación para lanzar la recogida: vuelve a pulsar y acepta.",cancelled:"Cancelado.",blocked_by_policy:"La política de tu organización no permite esta acción.",tool_error:"Claude no ha aceptado la petición: "+(e.message||"")}[c])||"No se ha podido completar ahora"+(e&&e.message?": "+e.message:".")+" Vuelve a intentarlo."}

function extPedir(tipo){return new Promise((res,rej)=>{const id=Math.random().toString(36).slice(2);const fin=()=>{window.removeEventListener("message",h);clearTimeout(t)};const h=e=>{if(e.source===window&&e.data&&e.data.respuesta&&e.data.id===id){fin();e.data.ok?res(e.data):rej(Object.assign(new Error(e.data.msg||"Error"),{code:"ext"}))}};const t=setTimeout(()=>{fin();rej(Object.assign(new Error("La extensión no responde. Recarga la página."),{code:"ext"}))},20000);window.addEventListener("message",h);window.postMessage({huelsanExt:tipo,id},location.origin)})}

async function descargarFotos(btn,coches){

    if(window.HUELSAN&&window.HUELSAN.FOTOS_WEB)(l.fotosWeb||[]).forEach((n,i)=>tareas.push({dir:dir+"web/",nombre:`web-${String(i+1).padStart(2,"0")}.jpg`,url:/^https?:/.test(n)?n:window.HUELSAN.FOTOS_WEB+n}))}

      try{const r=await fetch(t.url);if(!r.ok)throw 0;const b=await r.blob();zip.file(t.dir+(b.type==="image/png"?t.nombre.replace(/jpg$/,"png"):t.nombre),b)}catch(e){fallos++}
      hechas++;btn.textContent=`Descargando… ${hechas} de ${tareas.length}`}}));
    btn.textContent="Comprimiendo…";
    const out=await zip.generateAsync({type:"blob"});const a=document.createElement("a");a.href=URL.createObjectURL(out);
    a.download=uno?`fotos-${limpio([titleOf(coches[0]),coches[0].matricula].filter(Boolean).join("-")).replace(/ +/g,"-")}.zip`:`fotos-stock-${new Date().toISOString().slice(0,10)}.zip`;
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),10000);
    marcarDescargadas(coches.map(l=>l.id));if(!uno&&S.dlSel)S.dlSel=new Set();

  catch(e){toast("No se ha podido preparar el ZIP: "+e.message)}

const AUTO={tried:new Set(),blocked:false,t:null};

let estImportadas=false;
async function importarEstimaciones(){
  if(!S.db||!S.dbReady){setTimeout(importarEstimaciones,1500);return}
  try{const col=S.db.collection("estimaciones");
    const snap=typeof col.get==="function"?await col.get():await new Promise((res,rej)=>{let un=null,done=false;un=col.onSnapshot(sn=>{if(done)return;done=true;res(sn);setTimeout(()=>{try{un&&un()}catch(e){}},0)},rej)});
    let n=0;
    for(const d of snap.docs){const lotes=(d.data()||{}).lotes||{};
      for(const[id,patch]of Object.entries(lotes)){const l=S.lots.get(id);if(!l||!(patch&&patch.mercado>0))continue;
        if(l.mercado!=null||(l.manual&&l.manual.mercado))continue;
        S.lots.set(id,{...l,...patch});try{await S.db.doc("lotes/"+id).update(patch);n++}catch(e){}}
      try{await S.db.doc("estimaciones/"+d.id).delete()}catch(e){}}
    if(n){render();toast(`${n} precios estimados cargados`)}}
  catch(e){console.error(e)}
  finally{estImportadas=true}}
function autoEstimar(){

  const pend=[...S.lots.values()].filter(l=>!isPast(l)&&!isOwned(l)&&l.mercado==null&&!(l.manual&&l.manual.mercado)&&!AUTO.tried.has(l.id))
    .sort((a,b)=>new Date(cierreOf(a)||0)-new Date(cierreOf(b)||0));
  if(!pend.length)return;
  pend.forEach(l=>AUTO.tried.add(l.id));estimarVarios(pend,true)}

Precios en euros, enteros, IVA incluido.
Responde SOLO con un array JSON, un objeto por coche, en el mismo orden: [{"id":"…","precio":12345,"min":11000,"max":13500,"confianza":"media","nota":"…"}]

${JSON.stringify(lots.map(lotParaEstimar))}`;

async function leerPdf(buf){

    const tc=await page.getTextContent();const rows=[];
    for(const it of tc.items){if(!it.str||!it.str.trim())continue;const x=it.transform[4],y=vp.height-it.transform[5];
      let r=rows.find(r=>Math.abs(r.y-y)<3);if(!r){r={y,items:[]};rows.push(r)}r.items.push({x,w:it.width,s:it.str})}
    rows.sort((a,b)=>a.y-b.y);

      const obj=await Promise.race([new Promise(res=>{try{store.get(name,res)}catch(e){res(null)}}),new Promise(res=>setTimeout(()=>res(null),4000))]);
      if(!obj||obj.width<400||obj.height<200)continue;
      const c=document.createElement("canvas");c.width=obj.width;c.height=obj.height;const g=c.getContext("2d");
      if(obj.bitmap)g.drawImage(obj.bitmap,0,0);

function comparativaGastos(owned){
  const rows=owned.filter(l=>l.precioCompra||gastosDe(l).length);if(!rows.length)return"";
  const cats=GASTO_CATS.filter(c=>rows.some(l=>gastosPorCat(l)[c]));
  const avg=f=>{const v=rows.map(f).filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null};
  const dias=l=>{const a=l.compradoEn||l.importadoEn;if(!a)return null;const b=l.estado==="vendido"&&l.vendidoEn?new Date(l.vendidoEn):new Date();return Math.max(0,Math.round((b-new Date(a))/86400000))};
  const benef=l=>l.precioVenta?l.precioVenta-costeTotal(l):null;
  return`<h2 style="margin:22px 0 8px">Comparativa de gastos por coche</h2>
  <div class="tablewrap"><table><thead><tr><th>Coche</th><th>Estado</th><th class="num">Compra</th>${cats.map(c=>`<th class="num">${esc(c)}</th>`).join("")}<th class="num">Total gastos</th><th class="num">Gastos / compra</th><th class="num">Coste total</th><th class="num">Venta</th><th class="num">Beneficio</th></tr></thead><tbody class="tnum">
  ${rows.map(l=>{const pc=gastosPorCat(l),gt=gastosTotal(l),b=benef(l);return`<tr data-open="${esc(l.id)}"><td>${esc(titleOf(l))} ${l.matricula?`<span class="muted">${esc(l.matricula)}</span>`:""}</td><td>${ESTADO_LBL[l.estado]}</td><td class="num">${eur(l.precioCompra)}</td>${cats.map(c=>`<td class="num">${pc[c]?eur(pc[c]):"—"}</td>`).join("")}<td class="num"><b>${eur(gt)}</b></td><td class="num">${l.precioCompra?Math.round(gt/l.precioCompra*100)+" %":"—"}</td><td class="num">${eur(costeTotal(l))}</td><td class="num">${eur(l.precioVenta)}</td><td class="num">${b!=null?`<span style="color:var(${b>=0?"--good":"--bad"})">${eur(b)}</span>`:"—"}</td></tr>`}).join("")}
  ${rows.length>1?`<tr style="cursor:default"><td><b>Media</b></td><td></td><td class="num">${eur(avg(l=>l.precioCompra||null))}</td>${cats.map(c=>`<td class="num">${eur(avg(l=>gastosPorCat(l)[c]||0))}</td>`).join("")}<td class="num"><b>${eur(avg(gastosTotal))}</b></td><td></td><td class="num">${eur(avg(costeTotal))}</td><td class="num">${eur(avg(l=>l.precioVenta||null))}</td><td class="num">${eur(avg(benef))}</td></tr>`:""}
  </tbody></table></div>
  <div class="muted" style="font-size:12px;margin-top:6px">La media de cada categoría cuenta los coches sin gasto en ella como 0 €. Pulsa un coche para ver y añadir sus gastos.</div>`}

/* Al comprar o publicar un lote, su miniatura se copia al propio lote para que no se borre con la limpieza de miniaturas */
async function guardarMiniatura(l){
  if(!S.db||!l||l.miniatura||(l.fotos||[]).length||!l.miniPack)return;
  try{let d=S.thumbs.get(l.id);if(!d){const sn=await S.db.doc("miniaturas/"+l.miniPack).get();d=sn.exists?((sn.data().img||{})[l.id]||null):null}
    if(d){const cur=S.lots.get(l.id)||PRE.get(l.id);S.lots.set(l.id,{...cur,miniatura:d});await S.db.doc("lotes/"+l.id).update({miniatura:d})}}catch(e){}}
async function saveLot(id,patch){
  const cur=S.lots.get(id);if(!cur)return;
  if((patch.estado&&["comprado","stock","vendido"].includes(patch.estado))||patch.publico===true)guardarMiniatura(cur);
  const next={...cur,...patch,editado:new Date().toISOString()};S.lots.set(id,next);
  render();renderDrawer();
  if(S.db){try{await S.db.doc("lotes/"+id).update({...patch,editado:next.editado})}catch(e){try{await S.db.doc("lotes/"+id).set(next)}catch(e2){toast("No se ha podido guardar: "+(e2.message||e2.code))}}}
}
async function mergeData(subastas,lots){
  let nuevos=0,act=0;
  for(const subasta of subastas){S.subastas.set(subasta.id,{...(S.subastas.get(subasta.id)||{}),...subasta}); if(S.db)await S.db.doc("subastas/"+subasta.id).set(S.subastas.get(subasta.id));}
  const PRE=window.HUELSAN_HIST?await HUELSAN_HIST.precargar(lots.map(x=>x.id)).catch(()=>new Map()):new Map();
  for(const l0 of lots){const l={...l0};for(const k of["estado","publico","importadoEn","notas","fotos","precioCompra","precioVenta","gastos","pujaMax","mercado","precioRemate"])delete l[k];
    let cur=S.lots.get(l.id);
    // BCA a veces da otro LotId al mismo coche en la misma subasta: se fusiona con el que ya había (bastidor + subasta)
    if(!cur&&l.vin&&l.subastaId){const dup=[...S.lots.values()].find(x=>x.vin===l.vin&&x.subastaId===l.subastaId&&x.id!==l.id);
      if(dup){const ids=[...new Set([...(dup.idsBCA||[]),dup.id,l.id])];
        const nuestro=["comprado","stock","vendido"].includes(dup.estado)||dup.publico||dup.facturaVenta||dup.folleto||dup.folletos;
        if(nuestro){l.id=dup.id;l.idsBCA=ids;cur=dup}
        else{const man=dup.manual||{};const doc={...dup};for(const[k,v]of Object.entries(l))if(v!=null&&v!==""&&!man[k]&&!(k==="tipo"&&dup.tipoManual))doc[k]=v;
          doc.id=l.id;doc.idsBCA=ids;for(const k of Object.keys(doc))if(doc[k]===undefined)doc[k]=null;
          S.lots.delete(dup.id);S.lots.set(l.id,doc);if(S.db)await S.db.doc("lotes/"+l.id).set(doc);act++;continue}}}
    if(cur){const patch={};const man=cur.manual||{};for(const[k,v]of Object.entries(l)){if(v!=null&&v!==""&&!man[k]&&JSON.stringify(cur[k])!==JSON.stringify(v))patch[k]=v}
      if(cur.tipoManual)delete patch.tipo;
      if(Object.keys(patch).length){S.lots.set(l.id,{...cur,...patch});if(S.db)await S.db.doc("lotes/"+l.id).update(patch);act++}}
    else{const doc={...l,estado:"nuevo",publico:false,importadoEn:new Date().toISOString()};for(const k of Object.keys(doc))if(doc[k]===undefined)doc[k]=null;
      S.lots.set(l.id,doc);if(S.db)await S.db.doc("lotes/"+l.id).set(doc);nuevos++}}
  return {nuevos,act}}
async function importFiles(files){
  for(const file of files){
    try{
      let subastas,lots;
      if(/\.json$/i.test(file.name)){const p=JSON.parse(await file.text());subastas=p.subastas||[];lots=p.lotes||[]}
      else{const buf=await file.arrayBuffer();const wb=XLSX.read(buf,{type:"array",cellDates:false});
      const ws=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:null});
      const r=parseBCA(rows,file.name);subastas=[r.subasta];lots=r.lots}
      const {nuevos,act}=await mergeData(subastas,lots);
      toast(`${subastas.length>1?subastas.length+" subastas":(subastas[0]&&subastas[0].nombre)}: ${nuevos} lotes nuevos, ${act} actualizados`);
    }catch(e){toast(e.message||"No he podido leer "+file.name)}
  }
  render();
}

    $("#status").textContent=`Revisión automática cargada: ${n} lotes nuevos, ${a} actualizados`;render()}
  catch(e){console.error(e)} finally{merging=false}}

  if(t.closest("#more")){S.limit+=60;render();return}
  if(t.closest("#h-more")){S.histLimit=(S.histLimit||300)+300;render();return}
  const ar=t.closest("[data-archivar]");if(ar){if(ar.dataset.confirm!=="1"){ar.dataset.confirm="1";ar.textContent=`¿Archivar ${ar.dataset.n} lotes?`;setTimeout(()=>{if(ar.isConnected){ar.dataset.confirm="";ar.textContent="Archivar subasta"}},4000);return}
    await setArchivada(ar.dataset.archivar,true);return}
  const da=t.closest("[data-desarchivar]");if(da){await setArchivada(da.dataset.desarchivar,false);return}
  if(t.closest("#rec-login")){recLogin();return}
  if(t.closest("#rec-run")){recRun();return}
  const au=t.closest("[data-auc]");if(au){S.aucSel=au.dataset.auc||null;render();return}
  if(t.closest("[data-faplicar]")){aplicarYa();return}
  const sg=t.closest("[data-seg]");if(sg){draftF()[sg.dataset.seg]=sg.dataset.v;sg.parentElement.querySelectorAll("[data-seg]").forEach(b=>b.setAttribute("aria-pressed",b===sg));aplicarFiltros(sg);return}
  if(t.closest("#est-stop")){EST.ctl&&EST.ctl.abort();return}
  if(t.closest("#est-run")){const shown=baseLots().filter(l=>(S.f.estados.length?S.f.estados.includes(l.estado||"nuevo"):true)&&passes(l,S.f)&&l.mercado==null);estimarVarios(shown);return}
  if(t.closest("#est-one")&&S.open){const l=S.lots.get(S.open);if(l){const m={...(l.manual||{})};delete m.mercado;S.lots.set(l.id,{...l,manual:m,mercado:null});if(S.db)S.db.doc("lotes/"+l.id).update({manual:m}).catch(()=>{});estimarVarios([S.lots.get(l.id)])}return}
  if(t.closest("#usar-pujamax")&&S.open){const l=S.lots.get(S.open);const pm=l&&pujaMaxEst(l);if(pm)await saveLot(l.id,{pujaMax:pm,manual:{...(l.manual||{}),pujaMax:true}});return}
  if(t.closest("#h-est-clear")){S.histEstados=[];render();return}
  if(t.closest("#zonas-clear")){draftF().zonas=[];aplicarYa();return}
  if(t.closest("#ftoggle")){S.filtersOpen=!S.filtersOpen;render();return}
  if(t.closest("#freset")){clearTimeout(filT);filT=null;Object.assign(S.f,{q:"",anioMin:"",anioMax:"",precioMin:"",precioMax:"",kmMax:"",duenosMax:"",libro:"any",sinAverias:false,sinAccidentes:false,sinManip:false,margenMin:"",margenMax:"",margenPctMin:"",bajoPujaMax:false,mecMax:"",comb:[],cvMin:"",cvMax:"",motorMin:"",motorMax:"",tipos:[],plazasMin:"",ubic:"",iva:"any",proced:[],sinImportados:false,danosMax:"",estados:["nuevo","interesante","pujar"],incluirDesconocidos:true,modo:"todas",subUbic:"",zonas:[]});S.fd=null;S.aucSel=null;saveF();render();return}
  const stb=t.closest("[data-state]");if(stb&&S.open){const patch={estado:stb.dataset.state};const cl=S.lots.get(S.open);
    if(["comprado","stock"].includes(patch.estado)&&!cl.compradoEn)patch.compradoEn=new Date().toISOString();if(patch.estado==="vendido"&&!cl.vendidoEn)patch.vendidoEn=new Date().toISOString();if(["comprado","stock"].includes(patch.estado)&&!S.lots.get(S.open).precioCompra&&S.lots.get(S.open).pujaMax)patch.precioCompra=S.lots.get(S.open).pujaMax;await saveLot(S.open,patch);return}
  const tr=t.closest("[data-tri]");if(tr&&S.open){const v={"true":true,"false":false,"null":null}[tr.dataset.v];await saveLot(S.open,{[tr.dataset.tri]:v,manual:{...(S.lots.get(S.open).manual||{}),[tr.dataset.tri]:true}});return}
  if(t.closest("#bulk-noint")){
    const target=baseLots().filter(l=>(S.f.estados.length?S.f.estados.includes(l.estado||"nuevo"):true)&&passes(l,S.f)&&l.estado==="interesante");
    for(const l of target){S.lots.set(l.id,{...l,estado:"nuevo"});if(S.db){try{await S.db.doc("lotes/"+l.id).update({estado:"nuevo"})}catch(err){}}}
    toast(`${target.length} lotes desmarcados: vuelven a «Sin revisar»`);render();return}
  if(t.closest("#bulk-int")||t.closest("#bulk-desc")){
    const all=baseLots().filter(l=>S.f.estados.length?S.f.estados.includes(l.estado||"nuevo"):true);
    const target=t.closest("#bulk-int")?all.filter(l=>passes(l,S.f)&&(l.estado||"nuevo")==="nuevo"):all.filter(l=>!passes(l,S.f));
    const st=t.closest("#bulk-int")?"interesante":"descartado";
    for(const l of target){S.lots.set(l.id,{...l,estado:st});if(S.db){try{await S.db.doc("lotes/"+l.id).update({estado:st})}catch(err){}}}
    toast(`${target.length} lotes marcados como ${ESTADO_LBL[st].toLowerCase()}`);render();return}
  if(t.closest("#g-add")){addGasto();return}
  const gd=t.closest("[data-gdel]");if(gd){delGasto(gd.dataset.gdel,gd);return}
  if(t.closest("#imp-stock")){$("#file-stock").click();return}
  const dlu=t.closest("[data-dlfotos]");if(dlu){const l=S.lots.get(dlu.dataset.dlfotos);if(l)descargarFotos(dlu,[l]);return}
  if(t.closest("#dl-todos")||t.closest("#dl-ninguno")||t.closest("#dl-nuevos")){const inv=[...S.lots.values()].filter(l=>isOwned(l)&&l.estado!=="vendido"&&nFotos(l));const h=descargadas();
    S.dlSel=new Set(t.closest("#dl-todos")?inv.map(l=>l.id):t.closest("#dl-nuevos")?inv.filter(l=>!h[l.id]).map(l=>l.id):[]);render();return}
  const dck=t.closest("[data-dlsel]");if(dck){S.dlSel=S.dlSel||new Set();dck.checked?S.dlSel.add(dck.dataset.dlsel):S.dlSel.delete(dck.dataset.dlsel);const b=$("#dl-fotos-sel");if(b){b.textContent=`Descargar seleccionados (${S.dlSel.size})`;b.disabled=!S.dlSel.size}return}
  if(t.closest("#dl-fotos-sel")){const sel=[...(S.dlSel||[])].map(id=>S.lots.get(id)).filter(Boolean);if(sel.length)descargarFotos(t.closest("#dl-fotos-sel"),sel);return}
  if(t.closest("#imp-save")){guardarImport();return}
  if(t.closest("#imp")||t.closest("#impscrim"))return;
  if(t.closest("#add-manual")){const id="man-"+Date.now().toString(36);const doc={id,fuente:"Compra directa",subasta:null,subastaId:null,marca:"Nuevo coche",modelo:"",estado:"stock",publico:false,importadoEn:new Date().toISOString()};
    S.lots.set(id,doc);if(S.db)await S.db.doc("lotes/"+id).set(doc);S.open=id;render();renderDrawer();toast("Rellena los datos en la ficha");return}
  const dt=t.closest("[data-demtoggle]");if(dt){const d=S.demandas.get(dt.dataset.demtoggle);const estado=d.estado==="cerrada"?"activa":"cerrada";S.demandas.set(d.id,{...d,estado});render();if(S.db)await S.db.doc("demandas/"+d.id).update({estado});return}
  const dd=t.closest("[data-demdel]");if(dd){const b=dd;if(b.dataset.confirm!=="1"){b.dataset.confirm="1";b.textContent="¿Seguro?";setTimeout(()=>{if(b.isConnected){b.dataset.confirm="";b.textContent="Borrar"}},3000);return}
    S.demandas.delete(b.dataset.demdel);render();if(S.db)await S.db.doc("demandas/"+b.dataset.demdel).delete();return}
});
document.addEventListener("keydown",e=>{if(VIS.fotos.length){if(e.key==="Escape"){cerrarVisor();return}if(e.key==="ArrowRight"){moverVisor(1);return}if(e.key==="ArrowLeft"){moverVisor(-1);return}}
  if(e.key==="Escape"&&S.pubOpen){S.pubOpen=null;renderPubDrawer();return}
  if(e.key==="Escape"&&S.open){S.open=null;renderDrawer();return}
  const t=e.target;if((e.key==="Enter"||e.key===" ")&&t.matches&&t.matches(".lot[role=button]")){e.preventDefault();S.open=t.dataset.open;renderDrawer()}
  if((e.key==="Enter"||e.key===" ")&&t.matches&&t.matches("article.car[data-pubopen]")){e.preventDefault();S.pubOpen=t.dataset.pubopen;renderPubDrawer()}
  if((e.key==="Enter"||e.key===" ")&&t.matches&&t.matches("div.auc[data-auc]")){e.preventDefault();S.aucSel=t.dataset.auc||null;render()}});
document.addEventListener("submit",async e=>{e.preventDefault();const f=e.target;if(f.id!=="demform"&&f.id!=="leadform")return;
  const d=readDemand(f);d.origen=f.id==="leadform"?"web":"interno";d.id="d-"+Date.now().toString(36);
  S.demandas.set(d.id,d);f.reset();
  if(S.db){try{await S.db.doc("demandas/"+d.id).set(d)}catch(err){toast("No se ha podido guardar la petición");return}}
  const n=carsFor(d).length;toast(f.id==="leadform"?"Gracias. Te contactaremos pronto.":`Petición guardada · ${n} coche${n==1?"":"s"} encaja${n==1?"":"n"} ahora`);render()});

/* ---------- arranque ---------- */
try{const t=localStorage.getItem("huelsan-tab");if(t&&["subastas","interesantes","stock","clientes","busquedas","historico","publico"].includes(t)){S.tab=t;document.querySelectorAll("#tabs [data-tab]").forEach(x=>x.setAttribute("aria-selected",x.dataset.tab===t))}}catch(e){}
render();
(async()=>{
  const db=window.claude?await window.claude.use("db"):null;
  if(!db){$("#status").textContent="Sin conexión a la base de datos: los cambios no se guardarán";return}
  S.db=db;$("#status").textContent="Sincronizado";
  const seen=new Set();const done=k=>{if(k)seen.add(k);if(seen.size>=3)S.dbReady=true;render();const dr=$("#drawer");if(S.open&&!(dr&&dr.contains(document.activeElement)&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)))renderDrawer()};
  db.collection("lotes").onSnapshot(s=>{S.lots=new Map(s.docs.map(d=>{const x={...d.data(),id:d.id};if(!x.tipoManual&&x.tipo!=="Furgoneta"&&esFurgoneta(x))x.tipo="Furgoneta";return[d.id,x]}));done(s.metadata&&s.metadata.fromCache?null:"lotes");if(S.sample&&!EST.running)programarAuto()},e=>{$("#status").textContent="Error de conexión"});
  db.collection("subastas").onSnapshot(s=>{S.subastas=new Map(s.docs.map(d=>[d.id,{...d.data(),id:d.id}]));done("subastas")});
  db.collection("demandas").onSnapshot(s=>{S.demandas=new Map(s.docs.map(d=>[d.id,{...d.data(),id:d.id}]));done("demandas")});
  db.doc("recogida/sesion").onSnapshot(sn=>{S.sesion=sn.exists?sn.data():null;if(S.tab==="subastas"&&!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)))render()},()=>{});
  db.doc("recogida/actual").onSnapshot(sn=>{S.recogida=sn.exists?sn.data():null;if(S.tab==="subastas"&&!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)))render()},()=>{});
  window.claude.use("mcp").then(m=>{S.mcp=m}).catch(()=>{});
  let incoming=[];const tryMerge=()=>{if(S.dbReady)mergeIncoming(incoming);else setTimeout(tryMerge,800)};
  db.collection("entrantes").onSnapshot(s=>{incoming=s.docs;if(incoming.length)tryMerge()});
  const tryClean=()=>{if(S.dbReady&&!merging)limpiarMiniaturas();else setTimeout(tryClean,5000)};
  setTimeout(tryClean,8000);setInterval(()=>limpiarMiniaturas(),3600*1000);
  importarEstimaciones();
  try{S.assets=await window.claude.use("assets");if(S.open)renderDrawer()}catch(e){}
  try{S.sample=await window.claude.use("sample");if(S.sample){render();if(S.open)renderDrawer();programarAuto(4000)}}catch(e){}
})();
</script>
<script>
/* Huelsan · panel «Histórico completo» (se añade a la app al generar gestion/index.html).
   Al abrir la app solo se cargan del histórico los lotes buenos (grado A/B, daños 1–2, con precio de BCA).
   Desde aquí se busca o se carga el resto, y se aligera y archiva el histórico a mano. */
"use strict";
const HP={pedido:false,cnt:null,arch:null,ult:null,msg:"",tipo:"",ocupado:false,archivo:false};
function histPanel(){
  if(!HP.pedido&&window.HUELSAN_HIST&&S.db){HP.pedido=true;
    Promise.all([HUELSAN_HIST.noCargados().catch(()=>null),HUELSAN_HIST.archivados().catch(()=>null),
      S.db.doc("historico/mantenimiento").get().then(s=>s.exists?s.data():null).catch(()=>null)])
      .then(([a,b,c])=>{HP.cnt=a;HP.arch=b;HP.ult=c;if(S.tab==="historico")render()})}
  const n=x=>x==null?"…":num(x);
  const ult=HP.ult&&HP.ult.fecha?`Última vez: ${fdate(HP.ult.fecha)} (${n(HP.ult.aligerados||0)} aligerados, ${n(HP.ult.archivados||0)} archivados).`:"";
  const dis=HP.ocupado?"disabled":"";
  return`<div class="card" style="display:grid;gap:10px;margin-bottom:16px">
    <div><b>Histórico completo</b><div class="muted" style="font-size:13px;margin-top:2px">Al abrir la app solo se cargan del histórico los lotes con grado mecánico A o B, daños 1 o 2 y precio de BCA (salida o puja). El resto sigue guardado${HP.cnt!=null?` (${n(HP.cnt)} lotes)`:""}${HP.arch?`, más ${n(HP.arch)} en el archivo de subastas de hace más de un año`:""}: escribe en «Buscar en el histórico» y pulsa «Buscar en todo el histórico».</div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <button class="btn sm" data-hp="buscar" ${dis}>Buscar en todo el histórico</button>
      <button class="btn sm" data-hp="todo" ${dis}>Cargar todo el histórico</button>
      <label class="toggle" style="font-size:13px"><input type="checkbox" data-hp-arch ${HP.archivo?"checked":""}><span>Incluir el archivo (más de 1 año)</span></label></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:10px">
      <button class="btn sm" data-hp="aligerar" ${dis}>Aligerar y archivar ahora</button>
      <span class="muted" style="font-size:12.5px;flex:1 1 320px">Los lotes cerrados hace más de 3 meses se quedan con lo útil para comparar precios (datos del coche, daños, precios, notas del vendedor y una foto para la miniatura) y los de más de 1 año pasan al archivo. Los vuestros (interesantes, comprados, stock, vendidos o publicados) no se tocan. Se hace sola el día 1 de cada mes. ${ult}</span></div>
    ${HP.msg?`<div class="${HP.tipo==="bad"?"note":"muted"}" role="status" style="font-size:13px">${esc(HP.msg)}</div>`:""}
  </div>`}
async function hpAccion(que){
  if(HP.ocupado)return;
  const q=((document.getElementById("h-q")||{}).value||S.histQ||"").trim();
  if(que==="buscar"&&!q){HP.msg="Escribe primero algo en «Buscar en el histórico» (matrícula, marca, modelo o subasta).";HP.tipo="bad";render();return}
  if(que==="aligerar"&&!confirm("Se aligeran los lotes cerrados hace más de 3 meses y se archivan los de más de 1 año. Vuestros lotes no se tocan. ¿Seguimos?"))return;
  HP.ocupado=true;HP.msg=que==="aligerar"?"Aligerando el histórico…":"Buscando en la base de datos…";HP.tipo="";render();
  try{
    if(que==="buscar"){const k=await HUELSAN_HIST.buscar(q,HP.archivo);HP.msg=k?`${num(k)} lotes más encontrados y añadidos a la lista.`:`No hay más lotes con «${q}» fuera de los ya cargados.`}
    else if(que==="todo"){const k=await HUELSAN_HIST.cargarTodo(HP.archivo);HP.msg=`${num(k)} lotes más cargados. Al volver a abrir la app solo se cargarán otra vez los del filtro.`}
    else{const r=await HUELSAN_HIST.aligerar();HP.msg=`Hecho: ${num(r&&r.aligerados||0)} lotes aligerados y ${num(r&&r.archivados||0)} pasados al archivo.`;HP.pedido=false}
  }catch(e){HP.tipo="bad";HP.msg=/aligerar_historico|PGRST202|404/.test(String(e.message))?"Falta preparar la base de datos para esto (archivo supabase/04-historico.sql).":"No se ha podido completar: "+String(e.message||e).slice(0,200)}
  finally{HP.ocupado=false;render()}}
document.addEventListener("click",e=>{const b=e.target.closest("[data-hp]");if(b){e.preventDefault();hpAccion(b.dataset.hp)}});
document.addEventListener("change",e=>{if(e.target.matches("[data-hp-arch]"))HP.archivo=e.target.checked});
</script>
