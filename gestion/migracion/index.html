<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Huelsan · Copia de datos</title>
<style>
:root{--bg:#f6f5f2;--ink:#1a1a1a;--line:#ddd;--accent:#1f4e79}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--ink:#eee;--line:#333}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif;padding:24px 16px}
main{max-width:640px;margin:0 auto;display:grid;gap:14px}
input,button{font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:transparent;color:inherit}
button{background:var(--accent);color:#fff;border:0;font-weight:600;cursor:pointer}button:disabled{opacity:.6}
pre{white-space:pre-wrap;border:1px solid var(--line);border-radius:8px;padding:12px;min-height:120px;font-size:13px}
</style></head><body><main>
<h1 style="margin:0">Copia de datos del artifact</h1>
<p style="margin:0">Copia lotes, subastas, miniaturas, ajustes y fotos a la base de datos nueva. Se puede repetir sin duplicar nada. Antes, entra en la app de gestión con tu usuario.</p>
<input id="clave" type="password" placeholder="Clave de la copia" autocomplete="off">
<button id="go">Copiar datos</button>
<pre id="log"></pre>
</main>
<script>
"use strict";
const SB_URL="https://ajxdzchffqaphkmetswx.supabase.co",SB_KEY="sb_publishable_8n9P6btJois-b7B3-kNTTQ_YG6D4S1X";
const log=m=>{const p=document.getElementById("log");p.textContent+=m+"\n";p.scrollTop=p.scrollHeight};
function sesion(){try{return JSON.parse(localStorage.getItem("huelsan-sesion")||"null")}catch(e){return null}}
async function token(){let s=sesion();if(!s)throw new Error("No has entrado en la app de gestión. Entra primero en la página principal.");
  if(s.expires_at-Date.now()/1000<120){const r=await fetch(SB_URL+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:s.refresh_token})});
    const j=await r.json();if(!r.ok)throw new Error("Sesión caducada: vuelve a entrar en la app.");
    s={...s,access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at};localStorage.setItem("huelsan-sesion",JSON.stringify(s))}
  return s.access_token}
async function descifrar(clave){
  const buf=new Uint8Array(await (await fetch("datos.bin",{cache:"no-store"})).arrayBuffer());
  if(new TextDecoder().decode(buf.slice(0,4))!=="HSL1")throw new Error("Fichero de datos no válido");
  const salt=buf.slice(4,20),iv=buf.slice(20,32),ct=buf.slice(32);
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(clave),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:250000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  let gz;try{gz=await crypto.subtle.decrypt({name:"AES-GCM",iv},k,ct)}catch(e){throw new Error("Clave incorrecta")}
  const txt=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  return JSON.parse(txt)}
async function subirTabla(tabla,filas){
  const tam=tabla==="miniaturas"?10:400;
  for(let i=0;i<filas.length;i+=tam){
    const lote=filas.slice(i,i+tam).map(([id,data])=>({id,data}));
    const r=await fetch(`${SB_URL}/rest/v1/${tabla}?on_conflict=id`,{method:"POST",headers:{apikey:SB_KEY,Authorization:"Bearer "+await token(),"Content-Type":"application/json",Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify(lote)});
    if(!r.ok)throw new Error(`${tabla}: ${r.status} ${await r.text()}`);
    log(`  ${tabla}: ${Math.min(i+tam,filas.length)} de ${filas.length}`)}}
async function subirFichero(bucket,[nombre,tipo,b64]){
  const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  const r=await fetch(`${SB_URL}/storage/v1/object/${bucket}/${encodeURIComponent(nombre)}`,{method:"POST",headers:{apikey:SB_KEY,Authorization:"Bearer "+await token(),"Content-Type":tipo,"x-upsert":"true","Cache-Control":"31536000"},body:bin});
  if(!r.ok)throw new Error(`${bucket}/${nombre}: ${r.status} ${await r.text()}`)}
async function migrar(clave){
  log("Descargando y descifrando…");const d=await descifrar(clave);
  for(const[t,f]of Object.entries(d.tablas)){log(`Tabla ${t} (${f.length})`);await subirTabla(t,f)}
  for(const[b,lista]of Object.entries(d.ficheros)){log(`Fotos ${b} (${lista.length})`);
    for(let i=0;i<lista.length;i+=6){await Promise.all(lista.slice(i,i+6).map(x=>subirFichero(b,x)));log(`  ${Math.min(i+6,lista.length)} de ${lista.length}`)}}
  log("✔ Copia terminada.");return true}
window.HUELSAN_MIGRAR=migrar;
document.getElementById("go").onclick=async e=>{e.target.disabled=true;
  try{await migrar(document.getElementById("clave").value.trim())}catch(err){log("✖ "+err.message)}finally{e.target.disabled=false}};
</script></body></html>
