# Configuración de Netlify para la web pública de Huelsan Automoción (sitio estático, sin compilación)
[build]
  publish = "."
  # Cada publicación cuesta créditos de Netlify (plan gratis: 300 al mes, 15 por publicación).
  # La rama «prueba» siempre se publica como vista previa (gratis): prueba--<proyecto>.netlify.app
  # En «main» (la web real) solo se publica si el mensaje del commit contiene la marca de publicar entre corchetes.
  # Con la marca solo se publica la web que haya cambiado desde su última publicación (sin contar este archivo).
  ignore = "[ \"$BRANCH\" != \"main\" ] && exit 1; git log -1 --pretty=%B | grep -qF '[publicar]' || exit 0; git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)netlify.toml' && exit 0 || exit 1"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://ajxdzchffqaphkmetswx.supabase.co https://images.unsplash.com; connect-src 'self' https://ajxdzchffqaphkmetswx.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'none'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

