# Configuración de Netlify para la web pública de Huelsan Automoción (sitio estático, sin compilación)
[build]
  publish = "."
  # Cada publicación cuesta créditos de Netlify (plan gratis: 300 al mes, 15 por publicación).
  # Solo se publica si el mensaje del commit contiene [publicar]; el resto de commits se ignoran sin gastar.
  ignore = "git log -1 --pretty=%B | grep -qF '[publicar]' && exit 1 || exit 0"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://ajxdzchffqaphkmetswx.supabase.co; connect-src 'self' https://ajxdzchffqaphkmetswx.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'none'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

